<!-- <div class="file-viewer" *ngIf="filename"> -->
<h2 mat-dialog-title>{{ filename }}</h2>
<mat-dialog-content>
  <div [ngSwitch]="fileType">
    <img *ngSwitchCase="'image'" [src]="fileUrl" alt="{{ filename }}">
    <iframe *ngSwitchCase="'pdf'" [src]="safeUrl" width="100%" height="600px"></iframe>
    <iframe *ngSwitchCase="'text'" [src]="safeUrl" width="100%" height="600px"></iframe>
    <video *ngSwitchCase="'video'" [src]="fileUrl" controls width="100%">
      El navegador no soporta el elemento de video.
    </video>
    <audio *ngSwitchCase="'audio'" [src]="fileUrl" controls>
      El navegador no soporta este elemento de audio.
    </audio>
    <div *ngSwitchDefault>
      <p>No se puede previsualizar este tipo de archivo</p>
      <a [href]="fileUrl" target="_blank">Abrir en una nueva pestaña</a>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="openInNewTab()">Abrir en Nueva Pestaña</button>
  <button mat-button (click)="downloadFile(filename)">Descargar</button>
  <button mat-button (click)="closeDialog()">Cerrar</button>
</mat-dialog-actions>
