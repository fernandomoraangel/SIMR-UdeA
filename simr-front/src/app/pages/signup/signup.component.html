<div class="container">
  <div><img src="img/logomr.png" alt="Logo"></div>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="form-login">
    <div class="form-group">
      <label for="firstName">Nombre:</label>
      <input id="firstName" class="form-control" formControlName="firstName" type="text">
      <div *ngIf="signupForm.controls['firstName'].invalid && signupForm.controls['firstName'].touched">
        <small class="text-danger">Nombre es requerido</small>
      </div>
    </div>
    <div class="form-group">
      <label for="lastName">Apellido:</label>
      <input id="lastName" class="form-control" formControlName="lastName" type="text">
      <div *ngIf="signupForm.controls['lastName'].invalid && signupForm.controls['lastName'].touched">
        <small class="text-danger">Apellido es requerido</small>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" class="form-control" formControlName="email" type="email">
      <div *ngIf="signupForm.controls['email'].invalid && signupForm.controls['email'].touched">
        <small class="text-danger">Email es requerido y debe ser válido</small>
      </div>
    </div>
    <div class="form-group">
      <label for="username">Nombre Usuario:</label>
      <input id="username" class="form-control" formControlName="username" type="text">
      <div *ngIf="signupForm.controls['username'].invalid && signupForm.controls['username'].touched">
        <small class="text-danger">Nombre de usuario es requerido</small>
      </div>
    </div>
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input id="password" class="form-control" formControlName="password" type="password">
      <div *ngIf="signupForm.controls['password'].invalid && signupForm.controls['password'].touched">
        <small class="text-danger">Contraseña es requerida</small>
      </div>
    </div>
    <button class="btn btn-primary pull-right" type="submit" [disabled]="signupForm.invalid">Crear cuenta</button>
  </form>
  <a href="/">Regresar</a>
</div>
