<!-- Mostrar loader global mientras el AuthService está cargando -->
<div *ngIf="isLoading$ | async" class="global-loading">
  <div class="spinner"></div>
  <p>Cargando...</p>
</div>

<!-- Contenido del dashboard -->
<div *ngIf="!(isLoading$ | async)" class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    
    <!-- Información del usuario usando observable -->
    <div *ngIf="user$ | async as user" class="user-info">
      <div class="user-details">
        <span class="username">{{ user.username }}</span>
        <!-- <span class="user-role" *ngIf="user.role">{{ user.role }}</span> -->
      </div>
      <button 
        (click)="logout()" 
        class="logout-btn"
        [disabled]="isLoading$ | async">
        {{ (isLoading$ | async) ? 'Cerrando...' : 'Cerrar Sesión' }}
      </button>
    </div>
  </header>

  <main class="dashboard-content">
    <!-- Indicador de estado de autenticación -->
    <div class="auth-status" *ngIf="isAuthenticated$ | async">
      <span class="status-indicator online"></span>
      <span>Conectado</span>
    </div>

    <!-- Acciones principales -->
    <div class="actions">
      <button 
        (click)="redirectToAngularJS()" 
        class="btn btn-primary"
        [disabled]="!(isAuthenticated$ | async)">
        <i class="icon-arrow-right"></i>
        Ir a AngularJS
      </button>
      
      <button 
        (click)="redirectToLegacyApp()" 
        class="btn btn-secondary"
        [disabled]="!(isAuthenticated$ | async)">
        <i class="icon-external-link"></i>
        Ir a Legacy App
      </button>
      
      <button 
        (click)="loadProtectedData()" 
        class="btn btn-info" 
        [disabled]="loadingData || !(isAuthenticated$ | async)">
        <i class="icon-download" *ngIf="!loadingData"></i>
        <div class="mini-spinner" *ngIf="loadingData"></div>
        {{ loadingData ? 'Cargando...' : 'Cargar Datos' }}
      </button>
    </div>

    <!-- Mensajes de error -->
    <div *ngIf="errorMessage" class="error-message">
      <i class="icon-alert"></i>
      {{ errorMessage }}
      <button (click)="errorMessage = ''" class="close-btn">×</button>
    </div>

    <!-- Datos protegidos -->
    <div *ngIf="protectedData" class="protected-data">
      <h3>Datos Protegidos</h3>
      <div class="data-summary">
        <div class="stat-card">
          <div class="stat-number">{{ protectedData.users?.length || 0 }}</div>
          <div class="stat-label">Usuarios</div>
        </div>
      </div>
      
      <details class="data-details">
        <summary>Ver datos completos</summary>
        <pre class="data-json">{{ protectedData | json }}</pre>
      </details>
    </div>

    <!-- Estado vacío -->
    <div *ngIf="!protectedData && !loadingData" class="empty-state">
      <div class="empty-icon">📊</div>
      <h3>¡Bienvenido al Dashboard!</h3>
      <p>Haz clic en "Cargar Datos" para ver información protegida.</p>
    </div>
  </main>
</div>
