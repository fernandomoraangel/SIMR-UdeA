<section class="jumbotron">
  <div class="container">
    <div><img src="assets/images/logomr.png" alt="Logo" /></div>

    <h3>Cambiar contraseña</h3>

    @if (successMessage) {
      <div class="text-success" style="margin: 8px 0;">{{ successMessage }}</div>
    }

    <form class="form-login" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>Contraseña actual:</label>
      <input
        type="password"
        class="form-control"
        formControlName="currentPassword"
        required
      />

      <label>Nueva contraseña:</label>
      <input
        type="password"
        class="form-control"
        formControlName="newPassword"
        required
      />

      <label>Confirmar nueva contraseña:</label>
      <input
        type="password"
        class="form-control"
        formControlName="confirmPassword"
        required
      />

      @if (errorMessage) {
        <div class="text-danger" style="margin: 8px 0;">{{ errorMessage }}</div>
      }

      <input
        type="submit"
        class="btn btn-primary pull-right"
        value="Cambiar contraseña"
        [disabled]="form.invalid || isLoading"
      />
    </form>

    <br />
    <a routerLink="/">Regresar</a>
  </div>
</section>
