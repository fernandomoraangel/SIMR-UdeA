<section class="jumbotron">
  <div class="container">
    <div><img src="assets/images/logomr.png" alt="Logo" /></div>

    <h3>Nueva contraseña</h3>

    @if (successMessage) {
      <div class="text-success" style="margin: 8px 0;">
        {{ successMessage }}<br />
        Redirigiendo al inicio de sesión…
      </div>
    } @else if (token) {
      <form class="form-login" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>Nueva contraseña:</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          required
        />

        <label>Confirmar contraseña:</label>
        <input
          type="password"
          class="form-control"
          formControlName="confirmPassword"
          required
        />

        @if (errorMessage) {
          <div class="text-danger" style="margin: 8px 0;">{{ errorMessage }}</div>
        }

        <input
          type="submit"
          class="btn btn-primary pull-right"
          value="Restablecer"
          [disabled]="form.invalid || isLoading"
        />
      </form>
    } @else {
      <div class="text-danger">Token inválido o ausente.</div>
    }

    <br />
    <a routerLink="/login">Volver a inicio de sesión</a>
  </div>
</section>
