<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Sistema de Información de Músicas Regionales</title>
  <base href="/angular/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
  <!-- <link rel="shortcut icon" href="assets/images/favicon.png" /> -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script>
    // Define la URL del frontend para el servicio de archivos
    // Se detecta automáticamente según el puerto
    const currentPort = window.location.port;
    if (currentPort === '4200') {
      // Desarrollo - servidor Angular dev en 4200
      window.FRONTEND_URL = window.location.protocol + '//' + window.location.hostname + ':4200';
    } else {
      // Producción - servido a través de nginx
      window.FRONTEND_URL = window.location.protocol + '//' + window.location.hostname + (window.location.pathname.includes('/angular') ? '/angular' : '');
    }
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
