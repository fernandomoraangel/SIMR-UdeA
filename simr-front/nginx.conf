server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # File upload proxy - POST to backend
    location /files/ {
        proxy_pass http://simr-back:3000/files/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Crítico para uploads
        proxy_read_timeout 3600;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 5G;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Manejar rutas de Angular (SPA) - redirigir todo a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asegurar que los archivos estáticos se sirvan correctamente
    location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}
