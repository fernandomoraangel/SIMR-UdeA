services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: superAdmin
      MONGO_INITDB_ROOT_PASSWORD: sadmin1990
      MONGODB_AUTH_MECHANISM: SCRAM-SHA-256
    volumes:
      - mongodb_data_dev:/data/db
      - ./init.mongo.js:/docker-entrypoint-initdb.d/init.mongo.js
    networks:
      - simr-net-dev

  minio:
    image: minio/minio:latest
    container_name: minio_dev
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
      - ./init.minio.sh:/init.minio.sh
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    entrypoint: /bin/sh
    command: -c "/init.minio.sh"
    networks:
      - simr-net-dev

  simr-back:
    build:
      context: ./simr-back
      dockerfile: Dockerfile.dev
    container_name: simr-back_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # Puerto para debug
    volumes:
      - ./simr-back:/app
      - /app/node_modules
    env_file:
      - ./.env.development
    environment:
      - NODE_ENV=development
    depends_on:
      - mongodb
      - minio
    networks:
      - simr-net-dev

  simr-front:
    build:
      context: ./simr-front
      dockerfile: Dockerfile.dev
    container_name: simr-front_dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./simr-front:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - simr-back
    networks:
      - simr-net-dev

  web_server:
    image: nginx:latest
    container_name: nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - simr-back
      - simr-front
    networks:
      - simr-net-dev

volumes:
  mongodb_data_dev:
  minio_data_dev:

networks:
  simr-net-dev:
    external: false
