services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: superAdmin
      MONGO_INITDB_ROOT_PASSWORD: sadmin1990
      MONGODB_AUTH_MECHANISM: SCRAM-SHA-256
    volumes:
      - mongodb_data_dev:/data/db
      - ./init.mongo.js:/docker-entrypoint-initdb.d/init.mongo.js
    networks:
      - simr-net-dev

  minio:
    image: minio/minio:latest
    container_name: minio_dev
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    networks:
      - simr-net-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    volumes:
      - ./init.minio.sh:/init.minio.sh
    entrypoint: /bin/sh
    command: -c "/init.minio.sh"
    networks:
      - simr-net-dev
    restart: on-failure

  simr-back:
    build:
      context: ./simr-back
      dockerfile: Dockerfile.dev
    container_name: simr-back_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # Puerto para debug
    volumes:
      - ./simr-back:/app
      - /app/node_modules
    env_file:
      - ./.env.development
    environment:
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - simr-net-dev

  simr-front:
    build:
      context: ./simr-front
      dockerfile: Dockerfile.dev
    container_name: simr-front_dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./simr-front:/app
      - /app/node_modules
    depends_on:
      - simr-back
    networks:
      - simr-net-dev

  web_server:
    image: nginx:latest
    container_name: nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - simr-back
      - simr-front
    networks:
      - simr-net-dev

volumes:
  mongodb_data_dev:
  minio_data_dev:

networks:
  simr-net-dev:
    external: false
