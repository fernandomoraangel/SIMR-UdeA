services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: superAdmin
      MONGO_INITDB_ROOT_PASSWORD: sadmin1990
      MONGODB_AUTH_MECHANISM: SCRAM-SHA-256
    volumes:
      - /mnt/data/mongodb:/data/db
      - ./init.mongo.js:/docker-entrypoint-initdb.d/init.mongo.js
    networks:
      - simr-net-prod
    # No exponer puertos en producción por seguridad

  minio:
    image: minio/minio:latest
    container_name: minio_prod
    restart: unless-stopped
    volumes:
      - /mnt/data/minio:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    networks:
      - simr-net-prod
    # No exponer puertos en producción por seguridad

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    volumes:
      - ./init.minio.sh:/init.minio.sh
    entrypoint: /bin/sh
    command: -c "/init.minio.sh"
    networks:
      - simr-net-prod

  simr-back:
    build:
      context: ./simr-back
      dockerfile: Dockerfile.prod
    container_name: simr-back_prod
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      - mongodb
      - minio
    networks:
      - simr-net-prod

  simr-front:
    build:
      context: ./simr-front
      dockerfile: Dockerfile.prod
    container_name: simr-front_prod
    restart: unless-stopped
    expose:
      - "80" # Nginx interno
    networks:
      - simr-net-prod

  nginx:
    image: nginx:latest
    container_name: nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/data/ssl:/etc/ssl/certs:ro
    depends_on:
      - simr-back
      - simr-front
    networks:
      - simr-net-prod

# Volúmenes ya no son necesarios al usar bind mounts directos
# volumes:
#   mongodb_data_prod:
#   minio_data_prod:

networks:
  simr-net-prod:
    external: false
