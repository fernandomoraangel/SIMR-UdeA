services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: superAdmin
      MONGO_INITDB_ROOT_PASSWORD: sadmin1990
      MONGODB_AUTH_MECHANISM: SCRAM-SHA-256
    volumes:
      - mongodb_data:/data/db
      - ./init.mongo.js:/docker-entrypoint-initdb.d/init.mongo.js
    networks:
      - simr-net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    networks:
      - simr-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: superAdmin
      MINIO_ROOT_PASSWORD: sadmin1990
    volumes:
      - ./init.minio.sh:/init.minio.sh
    entrypoint: /bin/sh
    command: -c "/init.minio.sh"
    networks:
      - simr-net

  simr-back:
    build: ./simr-back
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # Puerto para debug
    volumes:
      - ./simr-back:/app
      - /app/node_modules
    env_file:
      - ./simr-back/.env
    depends_on:
      - mongodb
      - minio
    networks:
      - simr-net

  simr-front:
    build: ./simr-front
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./simr-front:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - simr-back
    networks:
      - simr-net

  web_server:
    image: nginx:latest
    restart: unless-stopped
    ports:
      # Mapeamos el puerto 80 del Host al puerto 80 del Nginx
      # Ahora, localhost apunta a Nginx (puerto por defecto).
      - "80:80"
    volumes:
      # Montamos la configuración del proxy de Nginx (creada abajo)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Aseguramos que el backend esté arriba antes que Nginx
      - simr-back
    networks:
      - simr-net

volumes:
  mongodb_data:
  minio_data:

networks:
  simr-net:
    external: false
