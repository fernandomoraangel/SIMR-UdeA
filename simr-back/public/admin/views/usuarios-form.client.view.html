<ng-include src="'core/views/core.client.view.html'"></ng-include>
<section class="container">
    <div class="page-header">
        <h1>{{ isEditMode ? 'Editar Usuario' : 'Crear Nuevo Usuario' }}</h1>
    </div>
    <div class="row" ng-if="error">
        <div class="col-md-12">
            <div class="alert alert-danger">
                <strong>Error:</strong> {{ error }}
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <form name="usuarioForm" ng-submit="guardarUsuario()" novalidate>

                <!-- Información básica -->
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">Información Básica</h3>
                    </div>
                    <div class="panel-body">

                        <div class="form-group"
                            ng-class="{ 'has-error': usuarioForm.username.$invalid && usuarioForm.username.$dirty }">
                            <label for="username">Nombre de Usuario *</label>
                            <input type="text" class="form-control" id="username" name="username"
                                ng-model="usuario.username" required ng-disabled="isEditMode">
                            <span class="help-block"
                                ng-show="usuarioForm.username.$invalid && usuarioForm.username.$dirty">
                                El nombre de usuario es requerido
                            </span>
                        </div>

                        <div class="form-group"
                            ng-class="{ 'has-error': usuarioForm.email.$invalid && usuarioForm.email.$dirty }">
                            <label for="email">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" ng-model="usuario.email"
                                required>
                            <span class="help-block" ng-show="usuarioForm.email.$invalid && usuarioForm.email.$dirty">
                                El email es requerido y debe ser válido
                            </span>
                        </div>

                        <div class="form-group"
                            ng-class="{ 'has-error': usuarioForm.password.$invalid && usuarioForm.password.$dirty }">
                            <label for="password">
                                Contraseña {{ isEditMode ? '(dejar en blanco para mantener la actual)' : '*' }}
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                ng-model="usuario.password" ng-required="!isEditMode">
                            <span class="help-block"
                                ng-show="usuarioForm.password.$invalid && usuarioForm.password.$dirty">
                                La contraseña es requerida
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="firstName">Nombre</label>
                            <input type="text" class="form-control" id="firstName" name="firstName"
                                ng-model="usuario.firstName">
                        </div>

                        <div class="form-group">
                            <label for="lastName">Apellido</label>
                            <input type="text" class="form-control" id="lastName" name="lastName"
                                ng-model="usuario.lastName">
                        </div>

                    </div>
                </div>

                <!-- Roles -->
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">Roles Asignados</h3>
                    </div>
                    <div class="panel-body">
                        <div class="checkbox" ng-repeat="role in roles">
                            <label>
                                <input type="checkbox" ng-model="selectedRoles[role._id]">
                                <strong>{{ role.displayName }}</strong> ({{ role.name }})
                                <span class="text-muted" ng-if="role.description">
                                    - {{ role.description }}
                                </span>
                            </label>
                        </div>
                        <p class="text-muted" ng-if="roles.length === 0">
                            No hay roles disponibles
                        </p>
                    </div>
                </div>

                <!-- Botones -->
                <div class="form-group">
                    <button type="submit" class="btn btn-success" ng-disabled="loading || usuarioForm.$invalid">
                        <i class="glyphicon glyphicon-save"></i>
                        {{ loading ? 'Guardando...' : 'Guardar' }}
                    </button>
                    <button type="button" class="btn btn-default" ng-click="cancelar()" ng-disabled="loading">
                        <i class="glyphicon glyphicon-remove"></i>
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>
</section>
