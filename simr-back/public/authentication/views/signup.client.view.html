<section ng-controller="AuthenticationController">
  <div class="container">
    <div><img src="img/logomr.png" alt="Logo" /></div>
    <form class="form-login" ng-submit="signupUser()" name="signupForm">
      <label> Nombre:</label>
      <input
        class="form-control"
        type="text"
        name="firstName"
        ng-model="user.firstName"
        required
      />
      <label>Apellido:</label>
      <input
        class="form-control"
        type="text"
        name="lastName"
        ng-model="user.lastName"
        required
      />
      <label>Email:</label>
      <input
        class="form-control"
        type="text"
        name="email"
        ng-model="user.email"
        required
      />
      <label>Nombre Usuario:</label>
      <input
        class="form-control"
        type="text"
        name="username"
        ng-model="user.username"
        required
      />
      <label>Contraseña:</label>
      <input
        class="form-control"
        type="password"
        name="password"
        ng-model="user.password"
        required
      />
      <input
        class="btn btn-primary pull-right"
        type="submit"
        value="Crear cuenta"
      />
    </form>
    <!-- <a href="/oauth/google">Identificarse usando Google</a> -->
    <a href="/">Regresar</a>
  </div>
</section>
