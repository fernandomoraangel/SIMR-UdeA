<!-- View coleccion-->
<ng-include src="'core/views/core.client.view.html'"></ng-include>
<section data-ng-controller="ColeccionesController" data-ng-init="findOne()">
  <div class="jumbotron" data-ng-if="auth.isAuthenticated">
    <div class="wrapper2">
      <!-- Identificador de la vista -->
      <div class="idVista">
        <em>Colección</em>
      </div>
      <div class="panel panel-default">
        <!-- Default panel contents -->
        <div
          class="tituloVistaView"
          data-ng-bind="coleccion.nombre | uppercase"
        ></div>
        <!-- Mostrar los botones de edición para el creador del artículo-->
        <div data-ng-show="auth.currentUser.id == coleccion.creador.id">
          <a href="/#!/colecciones/{{coleccion._id}}/edit"
            ><span class="glyphicon glyphicon-pencil"></span
          ></a>
          <a href="#" data-ng-click="delete();"
            ><span class="glyphicon glyphicon-remove"></span
          ></a>
        </div>

        <!-- Table -->
        <table class="table table-striped text-left">
          <tbody>
            <tr>
              <td class="campo">NOMBRE</td>
              <td data-ng-bind="coleccion.nombre"></td>
            </tr>

            <tr>
              <td class="campo">Tipo de colección</td>
              <td ng-bind="coleccion.tipo;"></td>
            </tr>

            <tr>
              <td class="campo">PROPIEDAD/COMODATO</td>
              <td data-ng-bind="coleccion.propiedadComodato"></td>
            </tr>

            <tr>
              <td class="campo">Fecha de creación</td>
              <td
                data-ng-bind="formatDate(coleccion.fechaDeCreacion,coleccion.precision)"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="creador">
        <em>Creada en </em>
        <em data-ng-bind="coleccion.creado |date:'mediumDate'"></em>
        <em>por</em>
        <em data-ng-bind="coleccion.creador.fullName"></em>
      </div>
    </div>
  </div>
</section>
