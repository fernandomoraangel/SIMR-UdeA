<!-- View listar obras-->
<ng-include src="'core/views/core.client.view.html'"></ng-include>
<section data-ng-controller="ObrasController" data-ng-init="find()">
  <div class="jumbotron bodyList" data-ng-if="auth.isAuthenticated">
    <label class="tituloVista">Obras</label>
    <!-- <pre>Sort by = {{propertyName}}; reverse = {{reverse}}</pre> -->
    <ul>
      <div class="wrapper">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>
                <span class="glyphicon glyphicon-filter"> </span>
                <input type="text" class="campoList" ng-model="search" />
                <!-- <button ng-click="propertyName = null; reverse = false">NO ORDENAR</button> -->
              </th>
            </tr>
          </thead>
        </table>

        <table class="table table-striped">
          <thead>
            <tr>
              <th>
                <!-- Columna sin título -->
              </th>
              <th>
                <button class="btn-lg3" ng-click="sortBy('titulo')">
                  TÍTULO
                </button>
                <span class="sortorder" ng-show="propertyName === 'titulo'" ng-class="{reverse: reverse}"></span>
              </th>
              <th>
                <button class="btn-lg3" ng-click="sortBy('tipo')">TIPO</button>
                <span class="sortorder" ng-show="propertyName === 'tipo'" ng-class="{reverse: reverse}"></span>
              </th>
              <th>
                <button class="btn-lg3" ng-click="sortBy('denominacionRegional')">
                  DENOMINACION REGIONAL
                </button>
                <span class="sortorder" ng-show="propertyName === 'denominacionRegional'"
                  ng-class="{reverse: reverse}"></span>
              </th>
              <th>
                <button class="btn-lg3" ng-click="sortBy('actores')">
                  ACTORES
                </button>
                <span class="sortorder" ng-show="propertyName === 'actores'" ng-class="{reverse: reverse}"></span>
              </th>

              <th>
                <button class="btn-lg3" ng-click="sortBy('generosFormas')">
                  GÉNEROS
                </button>
                <span class="sortorder" ng-show="propertyName === 'generosFormas'" ng-class="{reverse: reverse}"></span>
              </th>

              <th>
                <button class="btn-lg3" ng-click="sortBy('GenerosFormasNoMusicales')">
                  GÉN. NO M..
                </button>
                <span class="sortorder" ng-show="propertyName === 'GenerosFormasNoMusicales'"
                  ng-class="{reverse: reverse}"></span>
              </th>

              <th>
                <button class="btn-lg3" ng-click="sortBy('idiomas')">
                  IDIOMA
                </button>
                <span class="sortorder" ng-show="propertyName === 'idiomas'" ng-class="{reverse: reverse}"></span>
              </th>
            </tr>
          </thead>

          <tbody>
            <tr data-ng-repeat="obra in obras | orderBy:propertyName:reverse |filter:search">
              <td>
                <a href="/#!/obras/{{obra._id}}"><span class="glyphicon glyphicon-sunglasses"></span></a>
              </td>
              <td data-ng-bind="obra.titulo"></td>
              <td data-ng-bind="obra.tipo"></td>
              <td data-ng-bind="verDenominaciones(obra.denominacionRegional)"></td>
              <td data-ng-bind="verActores(obra.actores)"></td>
              <td data-ng-bind="verGeneros(obra.generosFormas)"></td>
              <td data-ng-bind="verGenerosNoMusicales(obra.GenerosFormasNoMusicales)"></td>
              <td data-ng-bind="verIdiomas(obra.idiomas)"></td>
              <td data-ng-show="canUpdate(obra)">
                <a href="/#!/obras/{{obra._id}}/edit"><span class="glyphicon glyphicon-pencil"></span></a>
              </td>
              <td data-ng-show="canDelete(obra)">
                <a href="#" data-ng-click="delete(obra)"><span class="glyphicon glyphicon-remove"></span></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ul>

    <div data-ng-hide="!obras || obras.length">
      <a href="/#!/obras/create"></a>
    </div>
  </div>
</section>
